syntax = "proto3";

package raft;

option go_package = "Flux-KV/api/proto/raft;raftpb";

// RaftService 定义 Raft 节点间的 RPC 通信
service RaftService {
  // RequestVote 候选者请求投票
  rpc RequestVote (RequestVoteRequest) returns (RequestVoteResponse);
  // AppendEntries Leader 复制日志或发送心跳
  rpc AppendEntries (AppendEntriesRequest) returns (AppendEntriesResponse);
}

// LogEntry 单条日志条目
message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  bytes command = 3;  // JSON 序列化的 Command
}

// RequestVoteRequest 投票请求
message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

// RequestVoteResponse 投票响应
message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

// AppendEntriesRequest 日志复制/心跳请求
message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

// AppendEntriesResponse 日志复制/心跳响应
message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
}
