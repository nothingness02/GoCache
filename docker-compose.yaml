networks:
  flux-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  etcd-data:
  rabbitmq-data:
  cp-node-1-data:
  cp-node-2-data:
  cp-node-3-data:
  ap-node-1-data:
  ap-node-2-data:
  ap-node-3-data:
  cdc-logs:
  prometheus-targets:

services:
  # ===== 基础设施层 =====

  etcd:
    image: public.ecr.aws/bitnami/etcd:3.5
    container_name: flux-etcd
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/bitnami/etcd
    networks:
      - flux-net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: flux-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - flux-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: flux-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "4317:4317"   # OTLP gRPC
      - "16686:16686" # Jaeger UI
    networks:
      - flux-net
    restart: unless-stopped

  # ===== CP 存储层 (Raft 强一致性) =====

  cp-node-1:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: flux-cp-node-1
    hostname: cp-node-1
    environment:
      - FLUX_ETCD_ENDPOINTS=etcd:2379
      - FLUX_RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      - FLUX_JAEGER_ENDPOINT=jaeger:4317
      - FLUX_AOF_FILENAME=/app/data/cp-node-1.aof
      - FLUX_PPROF_ENABLED=true
      - FLUX_POD_IP=cp-node-1
      - FLUX_RAFT_ENABLED=true
      - FLUX_RAFT_NODE_ID=cp-1
      - FLUX_RAFT_GROUP_ID=cp-group-1
      - FLUX_RAFT_PEERS=cp-node-2:50052,cp-node-3:50052
      - FLUX_RAFT_DATA_DIR=/app/data/raft
    ports:
      - "50052:50052"
      - "9091:9090"
    volumes:
      - cp-node-1-data:/app/data
    networks:
      - flux-net
    depends_on:
      etcd:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  cp-node-2:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: flux-cp-node-2
    hostname: cp-node-2
    environment:
      - FLUX_ETCD_ENDPOINTS=etcd:2379
      - FLUX_RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      - FLUX_JAEGER_ENDPOINT=jaeger:4317
      - FLUX_AOF_FILENAME=/app/data/cp-node-2.aof
      - FLUX_PPROF_ENABLED=true
      - FLUX_POD_IP=cp-node-2
      - FLUX_RAFT_ENABLED=true
      - FLUX_RAFT_NODE_ID=cp-2
      - FLUX_RAFT_GROUP_ID=cp-group-1
      - FLUX_RAFT_PEERS=cp-node-1:50052,cp-node-3:50052
      - FLUX_RAFT_DATA_DIR=/app/data/raft
    ports:
      - "50053:50052"
      - "9092:9090"
    volumes:
      - cp-node-2-data:/app/data
    networks:
      - flux-net
    depends_on:
      etcd:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  cp-node-3:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: flux-cp-node-3
    hostname: cp-node-3
    environment:
      - FLUX_ETCD_ENDPOINTS=etcd:2379
      - FLUX_RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      - FLUX_JAEGER_ENDPOINT=jaeger:4317
      - FLUX_AOF_FILENAME=/app/data/cp-node-3.aof
      - FLUX_PPROF_ENABLED=true
      - FLUX_POD_IP=cp-node-3
      - FLUX_RAFT_ENABLED=true
      - FLUX_RAFT_NODE_ID=cp-3
      - FLUX_RAFT_GROUP_ID=cp-group-1
      - FLUX_RAFT_PEERS=cp-node-1:50052,cp-node-2:50052
      - FLUX_RAFT_DATA_DIR=/app/data/raft
    ports:
      - "50054:50052"
      - "9093:9090"
    volumes:
      - cp-node-3-data:/app/data
    networks:
      - flux-net
    depends_on:
      etcd:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  # ===== AP 存储层 (高可用，无 Raft) =====

  ap-node-1:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: flux-ap-node-1
    hostname: ap-node-1
    environment:
      - FLUX_ETCD_ENDPOINTS=etcd:2379
      - FLUX_RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      - FLUX_JAEGER_ENDPOINT=jaeger:4317
      - FLUX_AOF_FILENAME=/app/data/ap-node-1.aof
      - FLUX_PPROF_ENABLED=true
      - FLUX_POD_IP=ap-node-1
      - FLUX_RAFT_ENABLED=false
    ports:
      - "50055:50052"
      - "9094:9090"
    volumes:
      - ap-node-1-data:/app/data
    networks:
      - flux-net
    depends_on:
      etcd:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  ap-node-2:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: flux-ap-node-2
    hostname: ap-node-2
    environment:
      - FLUX_ETCD_ENDPOINTS=etcd:2379
      - FLUX_RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      - FLUX_JAEGER_ENDPOINT=jaeger:4317
      - FLUX_AOF_FILENAME=/app/data/ap-node-2.aof
      - FLUX_PPROF_ENABLED=true
      - FLUX_POD_IP=ap-node-2
      - FLUX_RAFT_ENABLED=false
    ports:
      - "50056:50052"
      - "9095:9090"
    volumes:
      - ap-node-2-data:/app/data
    networks:
      - flux-net
    depends_on:
      etcd:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped
  ap-node-3:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: flux-ap-node-3
    hostname: ap-node-3
    environment:
      - FLUX_ETCD_ENDPOINTS=etcd:2379
      - FLUX_RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      - FLUX_JAEGER_ENDPOINT=jaeger:4317
      - FLUX_AOF_FILENAME=/app/data/ap-node-3.aof
      - FLUX_PPROF_ENABLED=true
      - FLUX_POD_IP=ap-node-3
      - FLUX_RAFT_ENABLED=false
    ports:
      - "50057:50052"
      - "9099:9090"
    volumes:
      - ap-node-3-data:/app/data
    networks:
      - flux-net
    depends_on:
      etcd:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  # ===== 网关层 =====

  gateway-1:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: flux-gateway-1
    hostname: gateway-1
    environment:
      - FLUX_ETCD_ENDPOINTS=etcd:2379
      - FLUX_JAEGER_ENDPOINT=jaeger:4317
      - FLUX_GATEWAY_GRPC_PORT=50051
      - FLUX_GATEWAY_METRICS_PORT=19090
      - FLUX_PPROF_ENABLED=false
      - FLUX_PPROF_PORT=6060
    ports:
      - "50051:50051"
      - "9096:19090"
    networks:
      - flux-net
    depends_on:
      etcd:
        condition: service_healthy
      cp-node-1:
        condition: service_started
      ap-node-1:
        condition: service_started
    restart: unless-stopped

  gateway-2:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: flux-gateway-2
    hostname: gateway-2
    environment:
      - FLUX_ETCD_ENDPOINTS=etcd:2379
      - FLUX_JAEGER_ENDPOINT=jaeger:4317
      - FLUX_GATEWAY_GRPC_PORT=50051
      - FLUX_GATEWAY_METRICS_PORT=19090
      - FLUX_PPROF_ENABLED=false
      - FLUX_PPROF_PORT=6060
    ports:
      - "50050:50051"
      - "9097:19090"
    networks:
      - flux-net
    depends_on:
      etcd:
        condition: service_healthy
      cp-node-1:
        condition: service_started
      ap-node-1:
        condition: service_started
    restart: unless-stopped

  # ===== 数据流层 =====

  cdc-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: flux-cdc-consumer
    environment:
      - FLUX_RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      - FLUX_CDC_EXCHANGE=flux_kv_events
      - FLUX_CDC_QUEUE=flux_cdc_file_logger
      - FLUX_CDC_LOG_PATH=/app/logs/flux_cdc.log
    volumes:
      - cdc-logs:/app/logs
    networks:
      - flux-net
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ===== 监控服务 =====

  prometheus-sd:
    build:
      context: .
      dockerfile: Dockerfile.prometheus-sd
    container_name: flux-prometheus-sd
    environment:
      - FLUX_ETCD_ENDPOINTS=etcd:2379
    ports:
      - "8082:8080"
    volumes:
      - prometheus-targets:/etc/prometheus/targets
    networks:
      - flux-net
    depends_on:
      etcd:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: flux-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus-targets:/etc/prometheus/targets
    networks:
      - flux-net
    depends_on:
      - prometheus-sd
    restart: unless-stopped
