server:
  port: 50052        # gRPC 默认监听端口
  mode: "debug"      # debug 或 release

storage:
  shard_type: "zerogc"    # 底层存储类型: "zerogc" | "map"
  locker_type: "sharded"  # 并发控制策略: "global" | "sharded"
  shard_count: 256        # 分片数量（仅 sharded 锁有效）
  shard_size: 10485760    # 单个 ZeroGCShard 容量（字节，默认 10MB）

raft:
  enabled: false     # 是否启用 Raft (CP 模式)
  node_id: "node-1"
  group_id: "cp-group-1"
  peers: []          # 同组其他节点地址列表，如 ["node-2:50052", "node-3:50052"]
  bind_addr: ":12000"  # 仅测试/独立模式使用，生产环境 Raft 与主 gRPC 共端口
  data_dir: "/app/data/raft"

log:
  level: "info"      # debug < info < warn < error
  encoding: "console"

aof:
  filename: "/app/data/go-kv.aof"  # 容器中的路径
  append_fsync: "everysec"
  batch_size: 100                  # 批量写入命令数
  flush_interval_ms: 10            # 批量刷盘最大间隔（毫秒）

etcd:
  endpoints:
    - "etcd:2379"  # 本地开发用 localhost，容器化后改为 etcd:2379

rabbitmq:
  url: "amqp://guest:guest@rabbitmq:5672/"  # 本地开发用，容器化后改为 rabbitmq

jaeger:
  endpoint: "jaeger:4317"  # OTLP endpoint，容器化后改为 jaeger:4317

pprof:
  enabled: true    # 默认禁用，开发环境可改为 true
  port: 6060

cdc:
  exchange: "flux_kv_events"
  queue: "flux_cdc_file_logger"
  log_path: "/app/logs/flux_cdc.log"

gateway:
  grpc_port: 50051
  metrics_port: 9090
  rate_limiter:
    enabled: true
    rate: 1000.0
    burst: 2000
  circuit_breaker:
    enabled: true
    window_size: 10s
    failure_threshold: 0.5
    min_calls: 5
    cooldown: 5s
    half_open_max_calls: 3
    success_threshold: 2
